<title id="t">Duster in Windows Terminal</title>
<desc id="d">du clean --dry-run scans 34 cache categories, lists what each would free (for example npm Cache 3.82 GB, Temporary Files 2.14 GB) and ends with: SCAN COMPLETE, 11.48 GB reclaimable. Preview only, pass --yes to actually delete. Example output.</desc>
