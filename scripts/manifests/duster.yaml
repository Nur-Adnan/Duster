ShortDescription: Native Windows CLI Deep Cleaning & Performance Optimizer.
Description: >-
  Duster (du) is a high-performance, Windows-native command-line cleaning
  and optimization utility. It safely reclaims disk space by cleaning
  35+ categories including browser caches, developer tool caches, system
  temp files, application caches (Discord, Spotify, Slack, Teams, Steam),
  GPU shader caches, crash dumps, and more. Features include live system
  monitoring, SSD TRIM optimization, DNS flushing, and detailed cleanup
  reporting with dry-run preview support.
