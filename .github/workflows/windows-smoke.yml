name: Windows Smoke Test

# Runs Duster's destructive commands for real on a throwaway Windows runner,
# including the desktop steps of docs/release-checklist.md: keys typed into a
# real terminal, Windows' own dialogs, real uninstalls and install.ps1's
# elevation. Run it before tagging (Actions > Windows Smoke Test > Run
# workflow); it also runs on pushes to smoke/** branches.
on:
  workflow_dispatch:
  push:
    branches:
      - 'smoke/**'

permissions:
  contents: read

jobs:
  smoke:
    name: Windows Smoke Test
    runs-on: windows-latest
    timeout-minutes: 55
    defaults:
      run:
        shell: powershell
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4
        with:
          persist-credentials: false

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: '1.26.x'
          cache: true
          cache-dependency-path: go.sum

      - name: Build
        env:
          CGO_ENABLED: 0
        run: |
          go build -o du.exe .
          if ($LASTEXITCODE) { throw 'go build failed' }
          # An older version string, so the update step has something to update.
          go build -ldflags "-X main.Version=1.0.1" -o du-old.exe .
          if ($LASTEXITCODE) { throw 'go build (old) failed' }
          # A real Inno Setup app for the uninstall checks.
          New-Item -ItemType Directory -Force dist | Out-Null
          Copy-Item du.exe dist\duster-windows-amd64.exe
          go build -ldflags "-H=windowsgui" -o dist\duw-windows-amd64.exe .\launcher\duw
          if ($LASTEXITCODE) { throw 'go build (duw) failed' }
          & 'C:\Program Files (x86)\Inno Setup 6\ISCC.exe' /Q installer\duster-setup.iss
          if ($LASTEXITCODE) { throw 'ISCC failed' }

      - name: Read-only commands and exit codes
        run: |
          $v = .\du.exe --version
          if ("$v" -notmatch '^Duster version \d+\.\d+\.\d+') { throw "unexpected --version output: $v" }

          $r = .\du.exe verify --json | Out-String | ConvertFrom-Json
          if ($LASTEXITCODE -ne 0 -or -not $r.healthy) { throw "verify: healthy=$($r.healthy) exit=$LASTEXITCODE" }

          $d = .\du.exe doctor --json | Out-String | ConvertFrom-Json
          $code = $LASTEXITCODE
          $d.results | ForEach-Object { Write-Host "  doctor $($_.status) $($_.name)" }
          if ($d.healthy -ne ($code -eq 0)) { throw "doctor exit code $code does not match healthy=$($d.healthy)" }

          $a = .\du.exe analyze --json . | Out-String | ConvertFrom-Json
          if ($a.total_size -le 0) { throw "analyze reported no size" }

          $s = .\du.exe status --json | Out-String | ConvertFrom-Json
          if ($LASTEXITCODE -ne 0 -or $s.RAMTotal -le 0) { throw "status --json failed" }
          # CPUTempC is left out when the machine exposes no thermal zone, as VMs usually don't.
          if ($null -ne $s.CPUTempC -and ($s.CPUTempC -le 0 -or $s.CPUTempC -ge 150)) { throw "status --json: implausible CPUTempC $($s.CPUTempC)" }
          Write-Host "  cpu temp: $(if ($null -ne $s.CPUTempC) { "$([math]::Round($s.CPUTempC, 1)) C" } else { 'no thermal zone exposed' })"
          $s.TopProcesses | ForEach-Object { Write-Host "  top $($_.Name) cpu=$([math]::Round($_.CPU, 1))%" }
          exit 0

      - name: Performance benchmarks (status tick, clean scan, path checks)
        run: |
          go test -run '^$' -bench . -benchtime 20x -benchmem ./lib/sysinfo
          if ($LASTEXITCODE) { exit $LASTEXITCODE }
          go test -run '^$' -bench 'ScanDirCategory|IsValidPath' -count 3 -benchmem ./cmd ./lib/fs

      - name: Clean (junction root, locked file)
        timeout-minutes: 15
        run: |
          # A category root that is a junction must be skipped, never followed.
          New-Item -ItemType Directory -Force C:\JTarget | Out-Null
          Set-Content C:\JTarget\keep.txt 'keep'
          $pip = Join-Path $env:LOCALAPPDATA 'pip\Cache'
          if (Test-Path $pip) { Remove-Item -Recurse -Force $pip }
          New-Item -ItemType Directory -Force (Split-Path $pip) | Out-Null
          cmd /c mklink /J "$pip" C:\JTarget | Out-Null

          # A locked temp file must be reported as a failure; an unlocked one deleted.
          $locked = Join-Path $env:TEMP 'duster-locked.txt'
          $loose = Join-Path $env:TEMP 'duster-loose.txt'
          Set-Content $loose 'x'
          $h = [IO.File]::Open($locked, 'Create', 'ReadWrite', 'None')
          try { $out = .\du.exe clean --yes | Out-String } finally { $h.Close() }
          Write-Host $out

          if (-not (Test-Path C:\JTarget\keep.txt)) { throw 'clean followed the junction at the pip cache root' }
          if (Test-Path $loose) { throw 'clean left an unlocked temp file behind' }
          if ($out -notmatch 'could not be deleted') { throw 'clean did not report the locked file' }
          exit 0

      - name: Purge (project markers, --safe to Recycle Bin)
        timeout-minutes: 5
        run: |
          $ws = Join-Path $env:USERPROFILE 'duster-ws'
          New-Item -ItemType Directory -Force "$ws\bare\node_modules\x", "$ws\app\node_modules\x" | Out-Null
          Set-Content "$ws\app\package.json" '{}'
          Set-Content "$ws\app\node_modules\x\f.js" 'x'

          $j = .\du.exe purge --path $ws --json | Out-String | ConvertFrom-Json
          $found = @($j.artifacts | ForEach-Object { $_.path })
          if ($found.Count -ne 1 -or $found[0] -notlike '*\app\node_modules') { throw "purge found: $($found -join ', ')" }

          $sid = [Security.Principal.WindowsIdentity]::GetCurrent().User.Value
          $bin = "C:\`$Recycle.Bin\$sid"
          $before = @(Get-ChildItem -Force $bin -Filter '$R*' -ErrorAction SilentlyContinue).Count
          .\du.exe purge --path $ws --safe --yes | Out-Host
          $after = @(Get-ChildItem -Force $bin -Filter '$R*' -ErrorAction SilentlyContinue).Count

          if (Test-Path "$ws\app\node_modules") { throw 'purge --safe left node_modules in place' }
          if ($after -le $before) { throw 'purge --safe did not move node_modules to the Recycle Bin' }
          if (-not (Test-Path "$ws\bare\node_modules")) { throw 'purge touched a node_modules with no project marker' }
          exit 0

      - name: Installer (top level of Downloads only)
        run: |
          $dl = Join-Path $env:USERPROFILE 'Downloads'
          New-Item -ItemType Directory -Force "$dl\Portable" | Out-Null
          foreach ($f in 'old-setup.exe', 'new-setup.exe', 'Portable\game.exe') { fsutil file createnew "$dl\$f" 62914560 | Out-Null }
          $old = (Get-Date).AddDays(-10)
          (Get-Item "$dl\old-setup.exe").LastWriteTime = $old
          (Get-Item "$dl\Portable\game.exe").LastWriteTime = $old

          $j = .\du.exe installer --json | Out-String | ConvertFrom-Json
          $names = @($j.discovered_setups | ForEach-Object { $_.name })
          Write-Host "found: $($names -join ', ')"
          if ('old-setup.exe' -notin $names) { throw 'installer missed a week-old setup file' }
          if ('new-setup.exe' -in $names) { throw 'installer listed a setup file newer than 7 days' }
          if ('game.exe' -in $names) { throw 'installer listed a file inside a Downloads subfolder' }
          exit 0

      - name: Update end to end (check, then --yes)
        run: |
          $dir = Join-Path $env:RUNNER_TEMP 'upd'
          New-Item -ItemType Directory -Force $dir | Out-Null
          Copy-Item du-old.exe "$dir\du.exe"

          $j = & "$dir\du.exe" update --json | Out-String | ConvertFrom-Json
          if ($j.status -ne 'NEW_VERSION_AVAILABLE') { throw "without --yes: $($j.status)" }
          if ((& "$dir\du.exe" --version) -notmatch '1\.0\.1') { throw 'update installed without --yes' }

          $j = & "$dir\du.exe" update --json --yes | Out-String | ConvertFrom-Json
          if ($j.status -ne 'UPDATE_SUCCESSFULLY_INSTALLED') { throw "with --yes: $($j.status)" }
          $v = & "$dir\du.exe" --version
          Write-Host "after update: $v"
          if ("$v" -notmatch [regex]::Escape($j.latest_version)) { throw "expected $($j.latest_version) after update" }
          exit 0

      # What a person would check at a desktop: keys typed into a real terminal
      # (a Windows pseudo console), Windows' own dialogs answered, and a real
      # Inno Setup app uninstalled. See e2e/.
      - name: Desktop checks (TUI keys, Recycle Bin prompt, real uninstalls)
        timeout-minutes: 20
        env:
          CGO_ENABLED: 0
        run: |
          $env:DU_E2E_BIN = (Resolve-Path du.exe).Path
          $env:DU_E2E_SETUP = (Get-ChildItem dist\installer\Duster-Setup-*.exe | Select-Object -First 1).FullName
          go test ./e2e -count=1 -v -timeout 18m

      # CI can't click a UAC prompt, and the runner is already elevated. These
      # copies of install.ps1 pretend a policy blocks AppData and that the
      # session is not elevated, so the real re-launch code runs (the runner
      # elevates without a prompt) and must install to Program Files.
      - name: Admin install path (elevated re-launch, denied prompt)
        timeout-minutes: 10
        run: |
          $dir = Join-Path $env:RUNNER_TEMP "Du ster's installer"
          New-Item -ItemType Directory -Force $dir | Out-Null
          $src = Get-Content scripts\install.ps1 -Raw
          $marker = 'if ($IsDefaultLocalAppData) {'
          if (([regex]::Matches($src, [regex]::Escape($marker))).Count -ne 1) { throw 'install.ps1 changed: update this step' }
          # The elevated copy gets -InstallDir, so it reports itself as admin.
          $fake = "function Test-WDACBlocked { param([string]`$Dir) `$true }`nfunction Test-IsAdminSession { `$UserSpecifiedDir }`n"
          Set-Content "$dir\install.ps1" $src.Replace($marker, $fake + $marker) -Encoding UTF8
          $pf = Join-Path $env:ProgramFiles 'Duster'

          & "$dir\install.ps1" -Silent
          if (-not (Test-Path "$pf\du.exe")) { throw 'the elevated re-launch did not install to Program Files' }
          & "$pf\du.exe" --version

          # Piped (irm | iex): no file to re-run, so the elevated copy fetches main's script.
          Remove-Item -Recurse -Force $pf
          & ([scriptblock]::Create((Get-Content "$dir\install.ps1" -Raw))) -Silent
          if (-not (Test-Path "$pf\du.exe")) { throw 'the piped re-launch did not install to Program Files' }

          # A denied prompt makes Start-Process -Verb RunAs throw.
          Remove-Item -Recurse -Force $pf
          $deny = "function Start-Process { throw 'The operation was canceled by the user.' }`n"
          Set-Content "$dir\install-deny.ps1" $src.Replace($marker, $fake + $deny + $marker) -Encoding UTF8
          # The installer's error goes to stderr; under the runner's 'Stop' preference
          # that would end this step before the checks below.
          $ErrorActionPreference = 'Continue'
          $out = & powershell -NoProfile -ExecutionPolicy Bypass -File "$dir\install-deny.ps1" -Silent 2>&1 | Out-String
          $code = $LASTEXITCODE
          Write-Host $out
          if ($code -eq 0) { throw 'a denied prompt did not fail the install' }
          if ($out -notmatch 'Could not obtain administrator privileges') { throw 'a denied prompt gave no clear error' }
          if (Test-Path "$pf\du.exe") { throw 'installed despite the denied prompt' }
          exit 0

      # v1.0.2's self-updater was a mock, so the release notes tell those users
      # to reinstall once. Do exactly that over a real 1.0.2 install.
      - name: Upgrade from v1.0.2 by reinstalling
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $dir = Join-Path $env:RUNNER_TEMP 'from-1.0.2'
          .\scripts\install.ps1 -InstallDir $dir -Version 1.0.2 -Silent
          if ((& "$dir\du.exe" --version) -notmatch '1\.0\.2') { throw 'did not start from 1.0.2' }

          .\scripts\install.ps1 -InstallDir $dir -Silent
          $latest = (Invoke-RestMethod 'https://api.github.com/repos/Nur-Adnan/Duster/releases/latest' -Headers @{ Authorization = "Bearer $env:GH_TOKEN" }).tag_name.TrimStart('v')
          $v = & "$dir\du.exe" --version
          Write-Host "after reinstall: $v"
          if ("$v" -notmatch [regex]::Escape($latest)) { throw "expected $latest after reinstalling" }
          $j = & "$dir\du.exe" update --json | Out-String | ConvertFrom-Json
          if ($j.status -ne 'UP_TO_DATE') { throw "update after reinstalling: $($j.status)" }
          exit 0

      # Neither WSL nor Docker Desktop is installed on the runner, so the only
      # way to exercise compaction is against a real VHDX put where Docker
      # Desktop keeps one. This is the only place diskpart's real output is
      # parsed, and the only place the detach actually has to happen.
      - name: Virtual disk compaction (real VHDX)
        timeout-minutes: 15
        run: |
          $ErrorActionPreference = 'Continue'
          $du = (Resolve-Path .\du.exe).Path
          $failures = @()

          # A machine with no virtual disks reports an empty list and exits 0,
          # and never compacts without --yes.
          $out = & $du vdisk --json 2>&1 | Out-String
          Write-Host "     exit=$LASTEXITCODE vdisk --json (nothing installed)"
          if ($LASTEXITCODE -ne 0) { $failures += "vdisk --json exited $LASTEXITCODE" }
          $preview = $out | ConvertFrom-Json
          if (-not $preview.preview_only) { $failures += 'vdisk --json was not a preview' }

          # Build a real expandable VHDX where Docker Desktop keeps its disk,
          # fill it with incompressible data, then delete the contents so
          # there is something for Windows to hand back.
          $dir = Join-Path $env:LOCALAPPDATA 'Docker\wsl\disk'
          New-Item -ItemType Directory -Force $dir | Out-Null
          $vhd = Join-Path $dir 'docker_data.vhdx'
          $script = Join-Path $env:RUNNER_TEMP 'mkvhd.txt'
          @(
            "create vdisk file=`"$vhd`" maximum=2048 type=expandable"
            "select vdisk file=`"$vhd`""
            'attach vdisk'
            'create partition primary'
            'format fs=ntfs quick label=duster'
            'assign letter=Q'
            'exit'
          ) | Set-Content -Encoding Ascii $script
          diskpart /s $script | Out-Host

          $blob = New-Object byte[] (64MB)
          [Random]::new(42).NextBytes($blob)
          for ($i = 0; $i -lt 8; $i++) { [IO.File]::WriteAllBytes("Q:\blob$i.bin", $blob) }
          Remove-Item 'Q:\blob*.bin' -Force
          @("select vdisk file=`"$vhd`"", 'detach vdisk', 'exit') | Set-Content -Encoding Ascii $script
          diskpart /s $script | Out-Host

          $before = (Get-Item $vhd).Length
          Write-Host ('     vhdx before: {0:N0} bytes' -f $before)

          # The real run. WSL is absent here, so this also proves a failed
          # `wsl --shutdown` is a warning rather than a dead end.
          $out = & $du vdisk --json --yes 2>&1 | Out-String
          $code = $LASTEXITCODE
          Write-Host $out
          if ($code -ne 0) { $failures += "vdisk --json --yes exited $code" }
          $j = $out | ConvertFrom-Json
          if ($j.warning) { Write-Host "     warning: $($j.warning)" }
          $r = $j.results | Where-Object { $_.path -eq $vhd }
          if (-not $r) {
            $failures += 'vdisk did not find the Docker disk'
          } elseif ($r.status -ne 'compacted') {
            $failures += "vdisk reported status=$($r.status) note=$($r.note)"
          } else {
            $after = (Get-Item $vhd).Length
            Write-Host ('     vhdx after: {0:N0} bytes (diskpart freed {1:N0} by our count)' -f $after, $r.freed_bytes)
            # Shrinking is Windows' job; growing would mean Duster compacted
            # the wrong thing, or left the disk attached and written to.
            if ($after -gt $before) { $failures += 'the disk grew during compaction' }
            if ($after -eq $before) { Write-Host '     note: diskpart reclaimed nothing from this disk' }
          }

          # The disk must not be left attached: a disk still attached is a
          # disk WSL can no longer start.
          $detail = Join-Path $env:RUNNER_TEMP 'detail.txt'
          @("select vdisk file=`"$vhd`"", 'detail vdisk', 'exit') | Set-Content -Encoding Ascii $detail
          $state = diskpart /s $detail | Out-String
          Write-Host $state
          if ($state -match 'State\s*:\s*Attached') { $failures += 'the disk was left attached to Windows' }

          Remove-Item -Force -Recurse (Join-Path $env:LOCALAPPDATA 'Docker') -ErrorAction SilentlyContinue
          if ($failures) { $failures | ForEach-Object { Write-Host "FAILED: $_" }; exit 1 }
          exit 0

      # Wrong input must fail cleanly (non-zero exit, no crash), and the safety
      # promises must hold without a terminal: nothing is deleted without
      # --yes, --dry-run deletes nothing, and repeated or concurrent runs work.
      - name: Invalid input, safety promises, repeated and concurrent runs
        timeout-minutes: 25
        run: |
          $ErrorActionPreference = 'Continue'
          $du = (Resolve-Path .\du.exe).Path
          $script:failures = @()
          function Check([string]$label, [string[]]$argv, [int[]]$want) {
            $out = & $du @argv 2>&1 | Out-String
            $code = $LASTEXITCODE
            $ok = ($want -contains $code) -and ($out -notmatch 'panic:|goroutine \d+ \[')
            $first = $out -split "`n" | Where-Object { $_.Trim() } | Select-Object -First 1
            Write-Host ('{0,-4} exit={1,-2} {2}: {3}' -f $(if ($ok) { 'ok' } else { 'FAIL' }), $code, $label, $first)
            if (-not $ok) { $script:failures += "$label (exit $code): $out" }
            return $out
          }
          $tmp = Join-Path $env:RUNNER_TEMP 'edge'
          New-Item -ItemType Directory -Force "$tmp\empty", "$tmp\rm" | Out-Null
          Set-Content "$tmp\file.txt" 'x'

          $null = Check 'unknown command' @('nosuchcmd') @(1)
          $null = Check 'unknown flag' @('clean', '--nosuchflag') @(1)
          $null = Check 'analyze: two paths' @('analyze', '--json', 'a', 'b') @(1)
          $null = Check 'analyze: missing path' @('analyze', '--json', "$tmp\missing") @(1)
          $null = Check 'analyze: a file' @('analyze', '--json', "$tmp\file.txt") @(0, 1)
          $e = Check 'analyze: empty folder' @('analyze', '--json', "$tmp\empty") @(0)
          if (($e | ConvertFrom-Json).total_size -ne 0) { $script:failures += 'analyze: an empty folder reported a size' }
          # What changed since last time: the first scan of a folder has
          # nothing to compare with (changes is null), the second explains
          # the growth, and --no-history leaves no trace.
          $grow = Join-Path $tmp 'grow'
          New-Item -ItemType Directory -Force "$grow\sub" | Out-Null
          [IO.File]::WriteAllBytes("$grow\sub\seed.bin", (New-Object byte[] (1MB)))
          $h1 = Check 'analyze: first scan of a folder' @('analyze', '--json', $grow) @(0)
          if ($null -ne ($h1 | ConvertFrom-Json).changes) { $script:failures += 'analyze: a first scan reported changes' }
          $blob = New-Object byte[] (20MB)
          [IO.File]::WriteAllBytes("$grow\sub\new.bin", $blob)
          $h2 = (Check 'analyze: second scan explains growth' @('analyze', '--json', $grow) @(0)) | ConvertFrom-Json
          if ($h2.changes.delta -ne 20MB) { $script:failures += "analyze: change was $($h2.changes.delta), want $(20MB)" }
          if (-not ($h2.changes.entries | Where-Object { $_.path -like '*new.bin' -and $_.status -eq 'new' })) {
            $script:failures += 'analyze: the new file was not named'
          }
          $quiet = Join-Path $tmp 'quiet'
          New-Item -ItemType Directory -Force $quiet | Out-Null
          $before = @(Get-ChildItem "$env:LOCALAPPDATA\Duster\history" -Directory -ErrorAction SilentlyContinue).Count
          $null = Check 'analyze --no-history' @('analyze', '--json', '--no-history', $quiet) @(0)
          $after = @(Get-ChildItem "$env:LOCALAPPDATA\Duster\history" -Directory -ErrorAction SilentlyContinue).Count
          if ($after -ne $before) { $script:failures += 'analyze --no-history saved a snapshot' }
          $null = Check 'analyze: bad --since' @('analyze', '--json', '--since', 'soon', $grow) @(1)
          $null = Check 'purge: missing path' @('purge', '--json', '--path', "$tmp\missing") @(1)
          $null = Check 'purge: drive root' @('purge', '--json', '--path', 'C:\') @(1)
          $null = Check 'purge: Windows folder' @('purge', '--json', '--path', $env:windir) @(1)
          $null = Check 'installer: not a number' @('installer', '--json', '--min-size', 'abc') @(1)
          $null = Check 'installer: negative size' @('installer', '--json', '--min-size', '-5') @(0)
          $u = Check 'uninstall --json' @('uninstall', '--json') @(0)
          $null = $u | ConvertFrom-Json
          $o = Check 'optimize preview' @('optimize', '--json') @(0)
          $oj = $o | ConvertFrom-Json
          # The reported-only items must always be listed, present or not.
          $ids = @($oj.reclaimable | ForEach-Object { $_.id })
          foreach ($id in @('windows_old', 'hibernation')) {
            if ($ids -notcontains $id) { $script:failures += "optimize --json did not report $id" }
          }
          foreach ($item in $oj.reclaimable) {
            Write-Host ('     reclaimable {0}: present={1} bytes={2} partial={3}' -f $item.id, $item.present, $item.bytes, $item.partial)
            if ($item.present -and $item.bytes -lt 0) { $script:failures += "$($item.id) reported a negative size" }
          }
          # --deep previews the component store: this runs DISM's read-only
          # analysis on a real Windows image, which is the only way to check
          # that Duster can read its report.
          $d = Check 'optimize --deep preview (DISM analyze)' @('optimize', '--deep', '--json') @(0)
          $dj = $d | ConvertFrom-Json
          $cs = $dj.tasks | Where-Object { $_.id -eq 'component_store' }
          if (-not $cs) { $script:failures += 'optimize --deep did not add the component_store task' }
          else {
            Write-Host ('     component_store: status={0} note={1} error={2}' -f $cs.status, $cs.note, $cs.error_message)
            if ($cs.error_message) { $script:failures += "component_store preview failed: $($cs.error_message)" }
            # Status 4 is skipped (analysis only); anything else means the
            # analysis did not run as a preview.
            if ($cs.status -ne 4) { $script:failures += "component_store preview status was $($cs.status), want skipped" }
            if (-not $cs.note) { $script:failures += 'component_store preview reported no analysis summary' }
            if ($dj.admin_elevated -and $cs.note -match 'needs Administrator') {
              $script:failures += 'component_store was skipped for admin rights on an elevated runner'
            }
          }
          $null = Check 'benchmark --json' @('benchmark', '--json') @(0)
          Copy-Item $du "$tmp\rm\du.exe"
          $null = & "$tmp\rm\du.exe" remove --json 2>&1
          Write-Host "     exit=$LASTEXITCODE remove --json (a copy)"
          Start-Sleep -Seconds 4
          if (-not (Test-Path "$tmp\rm\du.exe")) { $script:failures += 'remove --json without --force deleted the binary' }

          # Nothing is deleted without --yes, and --dry-run deletes nothing.
          $bait = Join-Path $env:TEMP 'duster-headless-bait.txt'
          Set-Content $bait 'x'
          $w = Check 'clean piped, no --yes, unknown --whitelist' @('clean', '--whitelist', 'nosuchcategory') @(0)
          if ($w -notmatch 'nosuchcategory') { $script:failures += 'clean did not warn about an unknown --whitelist name' }
          $null = Check 'clean --dry-run --yes' @('clean', '--dry-run', '--yes') @(0)
          if (-not (Test-Path $bait)) { $script:failures += 'clean deleted a temp file without --yes, or with --dry-run' }
          $ws = Join-Path $env:RUNNER_TEMP 'ws-noyes'
          New-Item -ItemType Directory -Force "$ws\app\node_modules\x" | Out-Null
          Set-Content "$ws\app\package.json" '{}'
          $null = Check 'purge piped, no --yes' @('purge', '--path', $ws) @(0)
          $d = Check 'purge --dry-run --yes' @('purge', '--path', $ws, '--dry-run', '--yes') @(0)
          if (-not (Test-Path "$ws\app\node_modules")) { $script:failures += 'purge deleted without --yes, or with --dry-run' }
          if ($d -notmatch 'nothing was deleted') { $script:failures += 'purge --dry-run did not say that nothing was deleted' }

          # Repeated: a second real clean right after the first (the Clean step) still works.
          $null = Check 'clean --yes again' @('clean', '--yes') @(0)
          Remove-Item $bait -ErrorAction SilentlyContinue

          # Concurrent: three purges at once, all appending to one operations.log.
          $log = Join-Path $env:LOCALAPPDATA 'Duster\operations.log'
          $before = if (Test-Path $log) { @(Get-Content $log).Count } else { 0 }
          $procs = foreach ($n in 1..3) {
            $c = Join-Path $env:RUNNER_TEMP "ws-c$n"
            New-Item -ItemType Directory -Force "$c\app\node_modules\x" | Out-Null
            Set-Content "$c\app\package.json" '{}'
            Set-Content "$c\app\node_modules\x\f.js" 'x'
            # Process.Start owns the handle from creation. Start-Process -PassThru only
            # keeps the exit code if .Handle is read before the process exits, and a
            # fast purge can win that race (ExitCode then reads as empty).
            $psi = New-Object Diagnostics.ProcessStartInfo $du
            $psi.Arguments = "purge --path `"$c`" --yes"
            $psi.UseShellExecute = $false
            [Diagnostics.Process]::Start($psi)
          }
          foreach ($p in $procs) {
            if (-not $p.WaitForExit(120000)) { $script:failures += "a concurrent purge (pid $($p.Id)) did not exit within 120 s" }
            elseif ($p.ExitCode -ne 0) { $script:failures += "a concurrent purge exited $($p.ExitCode)" }
          }
          foreach ($n in 1..3) { if (Test-Path "$env:RUNNER_TEMP\ws-c$n\app\node_modules") { $script:failures += "concurrent purge $n left node_modules" } }
          $lines = @(Get-Content $log | Select-Object -Skip $before)
          $bad = @($lines | Where-Object { $_ -notmatch '^\S.* \| Command: \w+ \| Action: \w+ \| Target: .+ \| Size: \d+ bytes \| Status: \w+$' })
          Write-Host "     operations.log: $($lines.Count) new lines after the concurrent purges, $($bad.Count) malformed"
          if ($bad.Count) { $script:failures += "operations.log has malformed lines: $($bad -join ' // ')" }

          if ($script:failures) { $script:failures | ForEach-Object { Write-Host "FAIL: $_" }; exit 1 }
          exit 0

      # Scheduled cleaning for real: register, let Task Scheduler start
      # duw.exe, which runs `du schedule run`, then turn it off; and a
      # standard (non-admin) user managing their own task.
      - name: Scheduled clean (register, run, turn off, standard user)
        timeout-minutes: 10
        run: |
          $dir = Join-Path $env:RUNNER_TEMP 'sched dir'
          New-Item -ItemType Directory -Force $dir | Out-Null
          Copy-Item du.exe "$dir\du.exe"
          Copy-Item dist\duw-windows-amd64.exe "$dir\duw.exe"
          $du = "$dir\du.exe"
          $data = Join-Path $env:LOCALAPPDATA 'Duster'
          $rec = Join-Path $data 'schedule.json'
          Remove-Item $rec -ErrorAction SilentlyContinue

          $j = & $du schedule on --dry-run --json | Out-String | ConvertFrom-Json
          if ($LASTEXITCODE -ne 0 -or -not $j.dry_run -or -not $j.would_clean) { throw "dry run: exit=$LASTEXITCODE" }
          $name = $j.task_name
          schtasks /Query /TN $name 2>$null | Out-Null
          if ($LASTEXITCODE -eq 0) { throw '--dry-run registered a task' }

          & $du schedule on --add recycle 2>$null | Out-Null
          if ($LASTEXITCODE -ne 1) { throw 'recycle was accepted' }

          $j = & $du schedule on --every daily --at 03:00 --add npm --json | Out-String | ConvertFrom-Json
          if ($LASTEXITCODE -ne 0 -or -not $j.enabled -or $j.every -ne 'daily' -or $j.categories -notcontains 'npm') { throw "on: $($j | ConvertTo-Json -Depth 5)" }

          schtasks /Run /TN $name | Out-Null
          for ($i = 0; $i -lt 180 -and -not (Test-Path $rec); $i++) { Start-Sleep 1 }
          Get-Content (Join-Path $data 'schedule.log') -ErrorAction SilentlyContinue | Write-Host
          if (-not (Test-Path $rec)) { throw 'the task did not record a run' }
          $j = & $du schedule --json | Out-String | ConvertFrom-Json
          if ($j.last_check.result -ne 'cleaned' -or -not $j.last_clean) { throw "after the run: $($j | ConvertTo-Json -Depth 6)" }

          $j = & $du schedule off --json | Out-String | ConvertFrom-Json
          if ($LASTEXITCODE -ne 0 -or $j.enabled) { throw 'off' }
          schtasks /Query /TN $name 2>$null | Out-Null
          if ($LASTEXITCODE -eq 0) { throw 'off left the task' }
          & $du schedule off | Out-Null
          if ($LASTEXITCODE -ne 0) { throw 'a second off failed' }

          # A standard user turns it on and off for themselves.
          $pw = 'Du!' + [guid]::NewGuid().ToString('N').Substring(0, 8) + 'aA1'   # net user prompts (Y/N) above 14 characters
          net user dsched $pw /add | Out-Null
          $cred = New-Object PSCredential('dsched', (ConvertTo-SecureString $pw -AsPlainText -Force))
          $pub = Join-Path $env:PUBLIC 'dsched'
          New-Item -ItemType Directory -Force $pub | Out-Null
          Copy-Item "$dir\du.exe", "$dir\duw.exe" $pub
          function AsUser($argList) {
            $p = Start-Process "$pub\du.exe" -Credential $cred -LoadUserProfile -ArgumentList $argList -Wait -PassThru `
              -WorkingDirectory $pub -RedirectStandardOutput "$pub\out.txt" -RedirectStandardError "$pub\err.txt"
            [pscustomobject]@{ Exit = $p.ExitCode; Out = (Get-Content "$pub\out.txt" -Raw); Err = (Get-Content "$pub\err.txt" -Raw) }
          }
          $r = AsUser @('schedule', 'on', '--json')
          if ($r.Exit -ne 0) { throw "standard user on: $($r.Out) $($r.Err)" }
          $r = AsUser @('schedule', '--json')
          if (-not ($r.Out | ConvertFrom-Json).enabled) { throw "standard user status: $($r.Out) $($r.Err)" }
          $r = AsUser @('schedule', 'off', '--json')
          if ($r.Exit -ne 0) { throw "standard user off: $($r.Out) $($r.Err)" }
          net user dsched /delete | Out-Null
          exit 0

      - name: Remove (self-uninstall)
        run: |
          $dir = Join-Path $env:LOCALAPPDATA 'Duster'
          New-Item -ItemType Directory -Force $dir | Out-Null
          Copy-Item du.exe "$dir\du.exe"
          Set-Content "$dir\operations.log" 'x'

          $j = & "$dir\du.exe" remove --json --force | Out-String | ConvertFrom-Json
          if ($LASTEXITCODE -ne 0 -or $j.status -ne 'SUCCESS') { throw "remove: $($j.status) exit=$LASTEXITCODE" }
          if (Test-Path "$dir\operations.log") { throw 'remove left the data folder contents' }
          # The binary deletes itself ~2 s after exit.
          for ($i = 0; $i -lt 30 -and (Test-Path "$dir\du.exe"); $i++) { Start-Sleep -Seconds 1 }
          if (Test-Path "$dir\du.exe") { throw 'remove did not delete the binary' }
          exit 0
