name: Release Pipeline

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      tag_name:
        description: 'Release tag (e.g. v1.0.2). Must already exist as a git tag.'
        required: true
        type: string

permissions:
  contents: write

env:
  GO_VERSION: '1.25.x'

jobs:
  # ── Stage 1: Test ──────────────────────────────────────────────────
  test:
    name: Test Suite
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4
        with:
          # workflow_dispatch must test the TAGGED tree, not main HEAD
          ref: ${{ github.event_name == 'workflow_dispatch' && inputs.tag_name || github.ref }}

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: ${{ env.GO_VERSION }}
          cache: true
          cache-dependency-path: go.sum

      - name: Verify Dependencies
        run: go mod verify

      - name: Run Tests
        env:
          CGO_ENABLED: 0
          DU_NO_OPLOG: "1"  # suppress operations.log so tests stay hermetic
        run: go test -count=1 -v ./...

      - name: Static Analysis
        run: go vet ./...

  # ── Stage 1b: Windows Test Gate ────────────────────────────────────
  # The product is Windows-only; the ubuntu job only exercises !windows
  # stubs. A release must not ship code the real platform never ran.
  test-windows:
    name: Windows Test Suite
    runs-on: windows-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event_name == 'workflow_dispatch' && inputs.tag_name || github.ref }}

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: ${{ env.GO_VERSION }}
          cache: true
          cache-dependency-path: go.sum

      - name: Run Tests (Windows)
        env:
          CGO_ENABLED: 0
          DU_NO_OPLOG: "1"
        run: go test -count=1 -v ./...

  # ── Stage 2: Build ─────────────────────────────────────────────────
  build:
    name: Build Windows Binaries
    needs: [test, test-windows]
    runs-on: ubuntu-latest
    env:
      # Optional Authenticode signing: set both WINDOWS_CODESIGN_* repo
      # secrets to enable. secrets.* is not available in step-level `if`,
      # so the gate is bridged through job env.
      CODESIGN_PFX_BASE64: ${{ secrets.WINDOWS_CODESIGN_PFX_BASE64 }}
    strategy:
      matrix:
        include:
          - goos: windows
            goarch: amd64
            suffix: amd64
          - goos: windows
            goarch: arm64
            suffix: arm64
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4
        with:
          # workflow_dispatch must build the TAGGED tree — building main HEAD
          # here published binaries whose source differed from the tag.
          ref: ${{ github.event_name == 'workflow_dispatch' && inputs.tag_name || github.ref }}

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: ${{ env.GO_VERSION }}
          cache: true
          cache-dependency-path: go.sum

      - name: Extract Version from Tag
        id: version
        env:
          # Pass via env, never interpolate ${{ inputs.* }} into run: text —
          # a crafted tag_name would execute in the runner shell.
          INPUT_TAG: ${{ inputs.tag_name }}
        run: |
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            TAG="$INPUT_TAG"
          else
            TAG="${GITHUB_REF_NAME}"
          fi
          echo "version=${TAG#v}" >> "$GITHUB_OUTPUT"
          echo "tag=${TAG}" >> "$GITHUB_OUTPUT"

      - name: Generate Windows Version Resources
        # Embeds VERSIONINFO (Explorer Properties dialog), the app icon,
        # and the longPathAware/DPI manifest into the PE via a .syso the Go
        # linker picks up (the *_windows_<arch>.syso suffix gates it per arch).
        # GOARCH is set ONLY on the goversioninfo invocation (which chooses the
        # resource machine type) — never on `go install`, or the tool would be
        # cross-compiled for the target arch and be unrunnable on the runner.
        env:
          MATRIX_GOARCH: ${{ matrix.goarch }}
          VERSION: ${{ steps.version.outputs.version }}
        run: |
          go install github.com/josephspurrier/goversioninfo/cmd/goversioninfo@v1.7.0
          IFS='.' read -r MAJOR MINOR PATCH <<< "$VERSION"
          MINOR="${MINOR:-0}"
          PATCH="${PATCH%%[-+]*}"
          PATCH="${PATCH:-0}"
          GOARCH="$MATRIX_GOARCH" "$(go env GOPATH)/bin/goversioninfo" \
            -ver-major "$MAJOR" -ver-minor "$MINOR" -ver-patch "$PATCH" -ver-build 0 \
            -product-ver-major "$MAJOR" -product-ver-minor "$MINOR" -product-ver-patch "$PATCH" -product-ver-build 0 \
            -file-version "$VERSION" -product-version "$VERSION" \
            -o "resource_windows_${MATRIX_GOARCH}.syso"

      - name: Compile Binary
        env:
          GOOS: ${{ matrix.goos }}
          GOARCH: ${{ matrix.goarch }}
          CGO_ENABLED: 0
        run: |
          BUILD_DATE=$(date +%Y-%m-%d)
          COMMIT=$(git rev-parse --short HEAD)
          go build -trimpath \
            -ldflags="-s -w \
              -X main.Version=${{ steps.version.outputs.version }} \
              -X main.BuildDate=${BUILD_DATE} \
              -X main.Commit=${COMMIT}" \
            -o duster-windows-${{ matrix.suffix }}.exe .

      - name: Sign Binary (Authenticode)
        # No-op until the WINDOWS_CODESIGN_* secrets are configured.
        # Signing runs BEFORE artifact upload so the ZIPs, checksums,
        # and installer all package the signed exe.
        if: env.CODESIGN_PFX_BASE64 != ''
        env:
          CODESIGN_PFX_PASSWORD: ${{ secrets.WINDOWS_CODESIGN_PFX_PASSWORD }}
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq osslsigncode
          umask 077
          printf '%s' "$CODESIGN_PFX_BASE64" | base64 -d > "$RUNNER_TEMP/codesign.pfx"
          osslsigncode sign \
            -pkcs12 "$RUNNER_TEMP/codesign.pfx" -pass "$CODESIGN_PFX_PASSWORD" \
            -n "Duster" -i "https://github.com/Nur-Adnan/Duster" \
            -t http://timestamp.digicert.com \
            -in "duster-windows-${{ matrix.suffix }}.exe" \
            -out "duster-windows-${{ matrix.suffix }}-signed.exe"
          mv "duster-windows-${{ matrix.suffix }}-signed.exe" "duster-windows-${{ matrix.suffix }}.exe"
          rm -f "$RUNNER_TEMP/codesign.pfx"

      - name: Upload Binary Artifact
        uses: actions/upload-artifact@v4
        with:
          name: duster-windows-${{ matrix.suffix }}
          path: duster-windows-${{ matrix.suffix }}.exe
          retention-days: 5

  # ── Stage 3: Package & Release ─────────────────────────────────────
  release:
    name: Package & Publish Release
    needs: build
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event_name == 'workflow_dispatch' && inputs.tag_name || github.ref }}

      - name: Extract Version from Tag
        id: version
        env:
          INPUT_TAG: ${{ inputs.tag_name }}
        run: |
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            TAG="$INPUT_TAG"
          else
            TAG="${GITHUB_REF_NAME}"
          fi
          echo "version=${TAG#v}" >> "$GITHUB_OUTPUT"
          echo "tag=${TAG}" >> "$GITHUB_OUTPUT"

      - name: Download AMD64 Binary
        uses: actions/download-artifact@v4
        with:
          name: duster-windows-amd64
          path: dist/

      - name: Download ARM64 Binary
        uses: actions/download-artifact@v4
        with:
          name: duster-windows-arm64
          path: dist/

      - name: Create Portable ZIP (AMD64)
        run: |
          mkdir -p dist/portable/Duster-${{ steps.version.outputs.version }}-Portable-x64
          cp dist/duster-windows-amd64.exe dist/portable/Duster-${{ steps.version.outputs.version }}-Portable-x64/du.exe
          cp README.md LICENSE SECURITY.md dist/portable/Duster-${{ steps.version.outputs.version }}-Portable-x64/ 2>/dev/null || true
          printf '@echo off\ntitle Duster\n"%%~dp0du.exe" --version\ncmd /K\n' > dist/portable/Duster-${{ steps.version.outputs.version }}-Portable-x64/Launch-Duster.bat
          cd dist/portable && zip -r ../Duster-${{ steps.version.outputs.version }}-Portable-x64.zip Duster-${{ steps.version.outputs.version }}-Portable-x64/

      - name: Create Portable ZIP (ARM64)
        run: |
          mkdir -p dist/portable/Duster-${{ steps.version.outputs.version }}-Portable-arm64
          cp dist/duster-windows-arm64.exe dist/portable/Duster-${{ steps.version.outputs.version }}-Portable-arm64/du.exe
          cp README.md LICENSE SECURITY.md dist/portable/Duster-${{ steps.version.outputs.version }}-Portable-arm64/ 2>/dev/null || true
          printf '@echo off\ntitle Duster\n"%%~dp0du.exe" --version\ncmd /K\n' > dist/portable/Duster-${{ steps.version.outputs.version }}-Portable-arm64/Launch-Duster.bat
          cd dist/portable && zip -r ../Duster-${{ steps.version.outputs.version }}-Portable-arm64.zip Duster-${{ steps.version.outputs.version }}-Portable-arm64/

      - name: Generate SHA-256 Checksums
        run: |
          cd dist
          sha256sum \
            duster-windows-amd64.exe \
            duster-windows-arm64.exe \
            Duster-${{ steps.version.outputs.version }}-Portable-x64.zip \
            Duster-${{ steps.version.outputs.version }}-Portable-arm64.zip \
            > checksums-sha256.txt

      - name: Create GitHub Release
        uses: softprops/action-gh-release@3bb12739c298aeb8a4eeaf626c5b8d85266b0e65 # v2
        with:
          tag_name: ${{ github.event_name == 'workflow_dispatch' && inputs.tag_name || github.ref_name }}
          files: |
            dist/duster-windows-amd64.exe
            dist/duster-windows-arm64.exe
            dist/Duster-${{ steps.version.outputs.version }}-Portable-x64.zip
            dist/Duster-${{ steps.version.outputs.version }}-Portable-arm64.zip
            dist/checksums-sha256.txt
            scripts/install.ps1
            scripts/install.cmd
            scripts/uninstall.ps1
          draft: false
          make_latest: true
          prerelease: false
          name: "Duster v${{ steps.version.outputs.version }}"
          body: |
            ## Duster v${{ steps.version.outputs.version }} — Windows Deep Cleaner & System Optimizer

            Production release for Windows 10/11 (x64 and ARM64).

            ---

            ### ⚡ Quick Install

            **PowerShell** (recommended — auto-detects architecture, verifies checksum, adds to PATH):
            ```powershell
            irm https://raw.githubusercontent.com/Nur-Adnan/Duster/main/scripts/install.ps1 | iex
            ```

            **CMD** (Command Prompt):
            ```cmd
            powershell -NoProfile -ExecutionPolicy Bypass -Command "irm https://raw.githubusercontent.com/Nur-Adnan/Duster/main/scripts/install.ps1 | iex"
            ```

            ---

            ### 📥 Manual Download

            | File | Architecture | Description |
            |------|-------------|-------------|
            | `duster-windows-amd64.exe` | x64 | Standalone binary (most PCs) |
            | `duster-windows-arm64.exe` | ARM64 | Standalone binary (Surface Pro X, etc.) |
            | `Duster-...-Portable-x64.zip` | x64 | Portable ZIP with launcher + docs |
            | `Duster-...-Portable-arm64.zip` | ARM64 | Portable ZIP with launcher + docs |
            | `Duster-Setup-...-x64.exe` | x64 | Guided installer (Start Menu, PATH); attached a few minutes after the other assets |
            | `install.ps1` | Any | PowerShell installer script |
            | `install.cmd` | Any | CMD installer script |
            | `uninstall.ps1` | Any | PowerShell uninstaller |
            | `checksums-sha256.txt` | — | SHA-256 checksums for all files |

            ### 🚀 Quick Start
            ```powershell
            du status          # Live system dashboard
            du clean --dry-run # Preview cleanable data
            du clean           # Deep clean (35 categories)
            du doctor          # System diagnostics
            du --help          # All commands
            ```

            ### 🔒 Security
            - Compiled with `CGO_ENABLED=0` — fully static, no C runtime
            - Built with `-trimpath` for reproducible builds
            - Stripped with `-s -w` for minimal binary size
            - SHA-256 checksums provided — verify before running

            > ⚠️ **Windows SmartScreen**: Click "More info" → "Run anyway" if blocked. This is normal for unsigned binaries.
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  # ── Stage 4: Build Inno Setup Installer (Windows runner) ───────────
  installer:
    name: Build Inno Setup Installer
    needs: [build, release]
    runs-on: windows-latest
    env:
      # Same optional-signing gate as the build job (see comment there).
      CODESIGN_PFX_BASE64: ${{ secrets.WINDOWS_CODESIGN_PFX_BASE64 }}
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event_name == 'workflow_dispatch' && inputs.tag_name || github.ref }}

      - name: Extract Version from Tag
        id: version
        shell: bash
        env:
          INPUT_TAG: ${{ inputs.tag_name }}
        run: |
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            TAG="$INPUT_TAG"
          else
            TAG="${GITHUB_REF_NAME}"
          fi
          echo "version=${TAG#v}" >> "$GITHUB_OUTPUT"
          echo "tag=${TAG}" >> "$GITHUB_OUTPUT"

      - name: Download AMD64 Binary
        uses: actions/download-artifact@v4
        with:
          name: duster-windows-amd64
          path: dist/

      - name: Install Inno Setup
        shell: powershell
        run: |
          choco install innosetup -y --no-progress
          echo "C:\Program Files (x86)\Inno Setup 6" | Out-File -Append -FilePath $env:GITHUB_PATH -Encoding utf8

      - name: Compile Installer
        shell: cmd
        run: |
          "C:\Program Files (x86)\Inno Setup 6\ISCC.exe" /DMyAppVersion=${{ steps.version.outputs.version }} installer\duster-setup.iss

      - name: Upload Installer Artifact
        uses: actions/upload-artifact@v4
        with:
          name: duster-installer
          path: dist/installer/Duster-Setup-*.exe
          retention-days: 5

      - name: Sign Installer (Authenticode)
        # No-op until the WINDOWS_CODESIGN_* secrets are configured.
        # Must run before upload and before the checksum append below.
        if: env.CODESIGN_PFX_BASE64 != ''
        shell: powershell
        env:
          CODESIGN_PFX_PASSWORD: ${{ secrets.WINDOWS_CODESIGN_PFX_PASSWORD }}
        run: |
          $ErrorActionPreference = "Stop"
          $pfx = Join-Path $env:RUNNER_TEMP "codesign.pfx"
          [IO.File]::WriteAllBytes($pfx, [Convert]::FromBase64String($env:CODESIGN_PFX_BASE64))
          try {
            $setup = Get-ChildItem dist/installer/Duster-Setup-*.exe | Select-Object -First 1
            ./scripts/sign.ps1 -CertPath $pfx -CertPassword $env:CODESIGN_PFX_PASSWORD -BinaryPath $setup.FullName
          } finally {
            Remove-Item $pfx -Force
          }

      - name: Upload Installer to Release
        uses: softprops/action-gh-release@3bb12739c298aeb8a4eeaf626c5b8d85266b0e65 # v2
        with:
          tag_name: ${{ github.event_name == 'workflow_dispatch' && inputs.tag_name || github.ref_name }}
          files: dist/installer/Duster-Setup-*.exe
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Append Installer Checksum to Release Checksums
        # The setup exe is aimed at the least technical users; it must not be
        # the one release artifact with no entry in checksums-sha256.txt.
        shell: bash
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAG: ${{ steps.version.outputs.tag }}
        run: |
          gh release download "$TAG" --pattern checksums-sha256.txt --output checksums-sha256.txt
          (cd dist/installer && sha256sum Duster-Setup-*.exe) >> checksums-sha256.txt
          gh release upload "$TAG" checksums-sha256.txt --clobber
