name: Continuous Integration

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

env:
  # Build/test on a supported toolchain (Go supports the two latest majors);
  # go.mod still declares 1.25 as the minimum language version.
  GO_VERSION: '1.26.x'

jobs:
  # ── Step 1: Static Analysis & Linting ──────────────────────────────────
  lint:
    name: Lint & Style Verification
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: ${{ env.GO_VERSION }}
          cache: true
          cache-dependency-path: go.sum

      - name: Verify Dependencies
        run: go mod verify

      - name: Go Format Check
        run: |
          UNFORMATTED_FILES=$(gofmt -s -l .)
          if [ -n "$UNFORMATTED_FILES" ]; then
            echo "The following Go files are not formatted correctly:"
            echo "$UNFORMATTED_FILES"
            echo "Please run 'gofmt -w -s .' to fix them."
            exit 1
          fi
          echo "✓ All files formatted correctly."

      - name: Go Vet Static Analysis
        run: go vet ./...

      - name: Vulnerability Scan (host and Windows targets)
        # Fails on known-vulnerable stdlib/dependency code reachable from
        # Duster (the shipped v1.0.2 binary carried 14 such findings).
        run: |
          go install golang.org/x/vuln/cmd/govulncheck@v1.8.0
          "$(go env GOPATH)/bin/govulncheck" ./...
          GOOS=windows "$(go env GOPATH)/bin/govulncheck" ./...

      - name: Staticcheck (host and Windows targets)
        # Windows-only files (*_windows.go, windows-tagged tests) are invisible
        # to a host-only run; a spinning select loop slipped through that way.
        run: |
          go install honnef.co/go/tools/cmd/staticcheck@v0.7.0
          "$(go env GOPATH)/bin/staticcheck" ./...
          GOOS=windows "$(go env GOPATH)/bin/staticcheck" ./...

  # ── Step 2: Test Suite ────────────────────────────────────────────────
  test:
    name: Unit Test Suite
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: ${{ env.GO_VERSION }}
          cache: true
          cache-dependency-path: go.sum

      - name: Run Unit Tests (with Race Detector)
        env:
          CGO_ENABLED: 1  # Race detector requires CGO
          DU_NO_OPLOG: "1"  # suppress operations.log so tests stay hermetic
        run: go test -count=1 -race -v ./...

  # ── Step 3: Windows Test Suite ─────────────────────────────────────────
  # The product is Windows-only; Linux runners only ever exercise the
  # !windows stubs. This job is the only one that tests the real code.
  test-windows:
    name: Windows Test Suite
    runs-on: windows-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: ${{ env.GO_VERSION }}
          cache: true
          cache-dependency-path: go.sum

      - name: Go Vet (Windows)
        run: go vet ./...

      - name: Run Unit Tests (Windows)
        env:
          CGO_ENABLED: 0
          DU_NO_OPLOG: "1"
        run: go test -count=1 -v ./...

      # install.ps1 is served from main, so it ships the moment it merges. Run it
      # (and uninstall.ps1) on real Windows PowerShell 5.1 against a published
      # release: download, checksum, extract, and exact PATH add/remove.
      - name: Installer Smoke Test (Windows PowerShell 5.1)
        shell: powershell
        run: |
          $dir = Join-Path $env:RUNNER_TEMP 'Duster'
          function Count-Entry($d) { @([Environment]::GetEnvironmentVariable('Path', 'User') -split ';' | Where-Object { $_.TrimEnd('\') -eq $d }).Count }
          # An entry that merely contains $dir as a substring must not satisfy the PATH check.
          [Environment]::SetEnvironmentVariable('Path', "$dir-old;" + [Environment]::GetEnvironmentVariable('Path', 'User'), 'User')
          # PATH must stay REG_EXPAND_SZ, with %VAR% entries left unexpanded.
          $envKey = [Microsoft.Win32.Registry]::CurrentUser.OpenSubKey('Environment', $true)
          $envKey.SetValue('Path', $envKey.GetValue('Path', '', 'DoNotExpandEnvironmentNames') + ';%USERPROFILE%\duster-var-probe', 'ExpandString')
          function Assert-RawPath($when) {
            $k = [Microsoft.Win32.Registry]::CurrentUser.OpenSubKey('Environment')
            if ("$($k.GetValueKind('Path'))" -ne 'ExpandString') { throw "after ${when}: the user PATH is no longer REG_EXPAND_SZ" }
            if ($k.GetValue('Path', '', 'DoNotExpandEnvironmentNames') -notlike '*%USERPROFILE%\duster-var-probe*') { throw "after ${when}: a %VAR% entry in the user PATH was expanded" }
          }

          .\scripts\install.ps1 -InstallDir $dir -Version 1.0.2 -Silent
          .\scripts\install.ps1 -InstallDir $dir -Version 1.0.2 -Silent -Force
          if ((Count-Entry $dir) -ne 1) { throw "install dir should be in the user PATH exactly once" }
          Assert-RawPath 'install'
          & "$dir\du.exe" --version
          if ($LASTEXITCODE -ne 0) { throw "du --version failed" }

          .\scripts\uninstall.ps1 -InstallDir $dir -Silent
          if ((Count-Entry $dir) -ne 0) { throw "uninstall left the install dir in the user PATH" }
          Assert-RawPath 'uninstall'
          if ((Count-Entry "$dir-old") -ne 1) { throw "uninstall removed an unrelated PATH entry" }
          if (Test-Path "$dir\du.exe") { throw "uninstall left du.exe behind" }

      - name: CMD Installer Test (path with a space and an apostrophe)
        shell: cmd
        run: |
          call scripts\install.cmd --dir "%RUNNER_TEMP%\Du ster's dir" 1.0.2 --silent
          if errorlevel 1 exit /b 1
          if not exist "%RUNNER_TEMP%\Du ster's dir\du.exe" (echo install.cmd did not install into the requested folder & exit /b 1)

      # The setup exe used to be compiled only at release time, after the
      # release was already public. Build it here and install/uninstall it.
      - name: Setup Installer Test (Inno Setup, per-user)
        shell: powershell
        run: |
          $env:CGO_ENABLED = '0'
          go build -o dist\duster-windows-amd64.exe .
          if ($LASTEXITCODE) { throw 'go build failed' }
          go build -ldflags "-H=windowsgui" -o dist\duw-windows-amd64.exe .\launcher\duw
          if ($LASTEXITCODE) { throw 'go build (duw) failed' }
          & 'C:\Program Files (x86)\Inno Setup 6\ISCC.exe' /Q installer\duster-setup.iss
          if ($LASTEXITCODE) { throw 'ISCC failed' }
          $setup = Get-ChildItem dist\installer\Duster-Setup-*.exe | Select-Object -First 1

          # A script install and its logs share %LOCALAPPDATA%\Duster with the setup exe's data.
          $shared = Join-Path $env:LOCALAPPDATA 'Duster'
          New-Item -ItemType Directory -Force $shared | Out-Null
          Copy-Item dist\duster-windows-amd64.exe "$shared\du.exe"
          Set-Content "$shared\operations.log" 'x'
          Set-Content "$shared\operations.log.old" 'x'
          function Count-Entry($d) { @([Environment]::GetEnvironmentVariable('Path', 'User') -split ';' | Where-Object { $_.TrimEnd('\') -eq $d }).Count }

          $app = Join-Path $env:RUNNER_TEMP 'Duster Setup Test'
          Start-Process $setup.FullName -ArgumentList '/VERYSILENT', '/SUPPRESSMSGBOXES', '/NORESTART', '/CURRENTUSER', "/DIR=`"$app`"" -Wait
          if (-not (Test-Path "$app\du.exe")) { throw 'setup did not install du.exe' }
          if ((Count-Entry $app) -ne 1) { throw 'setup did not add its folder to the user PATH exactly once' }

          Start-Process "$app\unins000.exe" -ArgumentList '/VERYSILENT', '/SUPPRESSMSGBOXES', '/NORESTART' -Wait
          # The uninstaller re-launches itself from %TEMP% and returns early.
          for ($i = 0; $i -lt 60 -and (Test-Path "$app\du.exe"); $i++) { Start-Sleep -Seconds 1 }
          for ($i = 0; $i -lt 30 -and (Test-Path "$shared\operations.log*"); $i++) { Start-Sleep -Seconds 1 }
          if (Test-Path "$app\du.exe") { throw 'uninstall left du.exe behind' }
          if ((Count-Entry $app) -ne 0) { throw 'uninstall left its folder in the user PATH' }
          if (Test-Path "$shared\operations.log*") { throw 'uninstall left the operation logs' }
          if (-not (Test-Path "$shared\du.exe")) { throw 'uninstall deleted a separate script install' }

      # The Chocolatey package downloads the release named in duster.nuspec and
      # checks it against the SHA-256 in tools\chocolateyinstall.ps1.
      - name: Chocolatey Package Test
        shell: powershell
        run: |
          $out = Join-Path $env:RUNNER_TEMP 'choco'
          choco pack scripts\manifests\duster.nuspec --outputdirectory $out
          if ($LASTEXITCODE) { throw 'choco pack failed' }
          choco install duster --source $out -y --no-progress
          if ($LASTEXITCODE) { throw 'choco install failed' }
          $want = ([xml](Get-Content scripts\manifests\duster.nuspec)).package.metadata.version
          $v = & "$env:ChocolateyInstall\bin\du.exe" --version
          if ("$v" -notmatch [regex]::Escape($want)) { throw "choco installed '$v', expected $want" }
          choco uninstall duster -y --no-progress
          if ($LASTEXITCODE) { throw 'choco uninstall failed' }
          if (Test-Path "$env:ChocolateyInstall\bin\du.exe") { throw 'choco uninstall left the du shim' }

  # ── Step 4: Build Verification ─────────────────────────────────────────
  build-verification:
    name: Compiler & Cross-Build Verification
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: ${{ env.GO_VERSION }}
          cache: true
          cache-dependency-path: go.sum

      - name: Run Build Integrity Verification Script
        run: |
          chmod +x scripts/verify_build.sh
          ./scripts/verify_build.sh
